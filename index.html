<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16191d">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lacets : lire des GPX, planifier des itinéraires moto, enregistrer ses balades et partager les sorties.">
  <title>Lacets</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="vendor/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/maplibre-gl.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Carte"></div>

  <div class="topbar" id="topbar">
    <div class="search-box">
      <svg class="i"><use href="#i-search"/></svg>
      <label for="search-input" class="visually-hidden">Rechercher un lieu</label>
      <input id="search-input" type="search" placeholder="Rechercher un lieu" autocomplete="off" enterkeyhint="search">
      <button class="btn btn-ghost btn-icon" id="search-clear" type="button" aria-label="Effacer la recherche" hidden><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <div class="search-results" id="search-results" hidden></div>
  </div>

  <div class="map-ctrl" id="map-ctrl">
    <button class="fab" id="btn-layers" type="button" aria-label="Fonds de carte"><svg class="i"><use href="#i-layers"/></svg></button>
    <button class="fab" id="btn-locate" type="button" aria-label="Me localiser"><svg class="i"><use href="#i-locate"/></svg></button>
    <button class="fab" id="btn-settings" type="button" aria-label="Réglages"><svg class="i"><use href="#i-gear"/></svg></button>
  </div>

  <button class="rec-pill" id="rec-pill" type="button" hidden>Enregistrement</button>

  <div id="screen-carte" data-screen="carte"></div>
  <div id="screen-planifier" data-screen="planifier" hidden></div>
  <div id="screen-parcours" data-screen="parcours" hidden></div>
  <div id="screen-communaute" data-screen="communaute" hidden></div>
  <div id="screen-rouler" data-screen="rouler" hidden></div>

  <nav id="tabbar" aria-label="Navigation principale">
    <button class="tab" type="button" data-tab="carte" aria-current="page"><svg class="i"><use href="#i-map"/></svg>Carte</button>
    <button class="tab" type="button" data-tab="planifier"><svg class="i"><use href="#i-plan"/></svg>Planifier</button>
    <button class="tab tab-ride" type="button" data-tab="rouler"><span class="tab-disc"><svg class="i"><use href="#i-moto"/></svg></span>Rouler</button>
    <button class="tab" type="button" data-tab="parcours"><svg class="i"><use href="#i-list"/></svg>Parcours</button>
    <button class="tab" type="button" data-tab="communaute"><svg class="i"><use href="#i-users"/></svg>Communauté</button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="gpx-input" multiple hidden>
</div>
